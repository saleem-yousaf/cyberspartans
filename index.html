<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03070b">
<meta name="description" content="The Awakening — a cinematic entrance to CyberSpartans cybersecurity and cloud consultancy.">
<title>CyberSpartans — The Awakening</title>
<link rel="preload" as="image" href="assets/awakening.png">
<style>
:root{color-scheme:dark;--cyan:#57e1ff;--ink:#03070b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--ink);color:#e4f3f8;font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:7px}.stage{position:relative;isolation:isolate;width:100%;height:100svh;min-height:360px;overflow:hidden;background:radial-gradient(ellipse at 50% 47%,#0a1b24 0%,#050a0f 46%,#020406 85%)}.art{position:absolute;left:50%;top:46%;width:min(110vw,1450px);aspect-ratio:1672/941;transform:translate(-50%,-50%);mask-image:linear-gradient(to bottom,#000 0%,#000 61%,transparent 79%);-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 61%,transparent 79%);opacity:0}.art img{display:block;width:100%;height:100%;object-fit:contain}.metal{clip-path:inset(0 49.9% 0 0)}.digital{clip-path:inset(0 0 0 50%)}.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 20%,#03070b99 77%,#03070b 100%)}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.scan{position:absolute;left:29%;right:29%;top:42%;height:1px;background:linear-gradient(90deg,transparent,#75ebff,transparent);box-shadow:0 0 25px 5px #2adaff65;opacity:0}.brand{position:absolute;left:0;right:0;top:72%;text-align:center;opacity:0;padding:0 20px}.brand h1{margin:0;font-size:clamp(18px,3.1vw,43px);font-weight:300;letter-spacing:.34em;padding-left:.34em;color:#d9e7ec;text-shadow:0 0 30px #81deff22}.brand p{font-size:clamp(10px,1vw,12px);font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:#7c959f;margin:19px 0 0}.controls{position:absolute;bottom:max(30px,env(safe-area-inset-bottom));left:clamp(24px,4vw,64px);right:clamp(24px,4vw,64px);display:flex;align-items:center;gap:24px}.track{height:1px;background:#617f873e;flex:1;position:relative;overflow:visible}.progress{height:1px;width:100%;transform:scaleX(0);transform-origin:left;background:#9af0ff;box-shadow:0 0 10px #67dfff}.skip,.replay{border:0;background:none;color:#91a6af;padding:12px 0;cursor:pointer;font-size:12px;letter-spacing:.05em;white-space:nowrap}.skip:hover,.replay:hover{color:white}.skip span{padding-left:12px;font-size:20px;vertical-align:-1px}.finish{position:absolute;left:0;right:0;top:85%;display:flex;justify-content:center;align-items:center;gap:24px;opacity:0;visibility:hidden;transition:opacity .45s}.enter{display:inline-flex;text-decoration:none;border:1px solid #3a606f;color:#d8f2f8;font-size:12px;letter-spacing:.08em;padding:13px 20px;gap:25px;background:#06121c99}.enter:hover{border-color:var(--cyan);background:#102733}.live-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.playing .metal{animation:metal 4s both}.playing .digital{animation:digital 4s both}.playing .scan{animation:scan 4s both}.playing .brand{animation:brand 4s both}.playing .progress{animation:progress 4s linear both}.complete .art{opacity:1;transform:translate(-50%,-50%) scale(1)}.complete .brand{opacity:1}.complete .finish{opacity:1;visibility:visible}.complete .controls{opacity:0;pointer-events:none}.leaving{opacity:0;transition:opacity .45s}.loading .brand{opacity:1}.loading .brand p{color:#a6bbc3}@keyframes metal{0%{opacity:0;filter:brightness(.25);transform:translate(-50%,-50%) scale(1.045)}22%{opacity:1;filter:brightness(.7)}60%,100%{opacity:1;filter:brightness(1);transform:translate(-50%,-50%) scale(1)}}@keyframes digital{0%,20%{opacity:0;clip-path:inset(0 48% 0 50%);filter:brightness(2)}55%{opacity:1;clip-path:inset(0 0 0 50%);filter:brightness(1.3)}100%{opacity:1;clip-path:inset(0 0 0 50%);filter:brightness(1)}}@keyframes scan{0%,37%{opacity:0;transform:scaleX(.1)}44%{opacity:1;transform:scaleX(.55)}60%{opacity:.55;transform:scaleX(1.4)}78%,100%{opacity:0;transform:scaleX(1.7)}}@keyframes brand{0%,56%{opacity:0;transform:translateY(10px);filter:blur(6px)}80%,100%{opacity:1;transform:translateY(0);filter:blur(0)}}@keyframes progress{to{transform:scaleX(1)}}@media(max-width:600px){.art{width:180vw;top:43%}.brand{top:67%}.brand h1{font-size:20px;letter-spacing:.19em;padding-left:.19em}.brand p{letter-spacing:.14em;margin-top:16px}.scan{left:12%;right:12%;top:37%}.finish{top:81%;gap:18px}.controls{gap:18px;bottom:22px}}@media(max-height:540px) and (min-width:601px){.art{width:85vw;top:40%}.brand{top:68%}.brand h1{font-size:24px}.brand p{margin-top:10px}.finish{top:82%}.controls{bottom:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.art,.brand{opacity:1}.scan,canvas{display:none}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="CyberSpartans cinematic introduction">
  <div class="art metal" aria-hidden="true"><img src="assets/awakening.png" alt="" fetchpriority="high"></div>
  <div class="art digital" aria-hidden="true"><img src="assets/awakening.png" alt=""></div>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="scan" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div>
  <div class="brand"><h1>CYBERSPARTANS</h1><p>Cybersecurity &amp; Cloud Consultancy</p></div>
  <div class="controls"><div class="track" aria-hidden="true"><div class="progress"></div></div><button class="skip" id="skip">Skip intro <span aria-hidden="true">›</span></button></div>
  <div class="finish"><a class="enter" href="https://cyberspartans.co.uk/">Enter CyberSpartans <span aria-hidden="true">↗</span></a><button class="replay" id="replay">Replay intro</button></div>
  <p class="live-status" id="status" role="status" aria-live="polite"></p>
</main>
<script>
(()=>{
  const HOME='https://cyberspartans.co.uk/';
  // Preview keeps the completed frame visible. Normal visits open the homepage.
  const preview=new URLSearchParams(location.search).get('preview')==='1';
  const stage=document.getElementById('stage'),status=document.getElementById('status');
  const motion=matchMedia('(prefers-reduced-motion: reduce)');
  let timer,frame,startTime=0,leaving=false;
  function seen(){try{return sessionStorage.getItem('cyberspartans-intro-seen')==='1'}catch{return false}}
  function remember(){try{sessionStorage.setItem('cyberspartans-intro-seen','1')}catch{}}
  function enter(){if(leaving)return;leaving=true;clearTimeout(timer);cancelAnimationFrame(frame);remember();stage.classList.add('leaving');setTimeout(()=>location.replace(HOME),motion.matches?0:450)}
  function finish(){cancelAnimationFrame(frame);ctx.clearRect(0,0,w,h);stage.classList.remove('playing');stage.classList.add('complete');status.textContent='Introduction complete. Enter CyberSpartans or replay the intro.';remember();if(!preview)enter()}
  const canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,points=[];
  function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);points=Array.from({length:w<600?55:100},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,delay:Math.random()*.6}))}
  function render(now){const t=(now-startTime)/1000;ctx.clearRect(0,0,w,h);if(t>4||motion.matches)return;const activity=Math.max(0,Math.sin(Math.PI*Math.min(1,Math.max(0,(t-.5)/3))));points.forEach(p=>{const easing=Math.min(1,Math.max(0,(t-.6-p.delay)/2));const x=w*(.52+p.x*.32*(1-easing*.65));const y=h*(.13+p.y*.49);ctx.fillStyle=`rgba(83,216,255,${activity*(.15+p.r*.25)})`;ctx.fillRect(x,y,p.r*1.3,p.r*1.3);if(p.r>1.2){ctx.strokeStyle=`rgba(68,202,244,${activity*.08})`;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+20*(1-easing),y);ctx.stroke()}});frame=requestAnimationFrame(render)}
  function play(){clearTimeout(timer);cancelAnimationFrame(frame);leaving=false;stage.classList.remove('playing','complete','leaving','loading');void stage.offsetWidth;if(motion.matches){finish();return}stage.classList.add('playing');status.textContent='The Awakening. A four-second CyberSpartans helmet reveal.';startTime=performance.now();frame=requestAnimationFrame(render);timer=setTimeout(finish,4000)}
  document.getElementById('skip').addEventListener('click',()=>preview?finish():enter());document.getElementById('replay').addEventListener('click',play);
  addEventListener('resize',resize);motion.addEventListener('change',()=>{if(motion.matches)finish()});resize();
  if(!preview&&seen()){enter();return}
  const image=document.querySelector('.art img');stage.classList.add('loading');image.decode().catch(()=>{}).then(play);
})();
</script>
</body>
</html>
